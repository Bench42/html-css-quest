<title>HTML/CSS Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Russo+One&display=swap">
<style>
/* Концепт: чертёжный стол. Бумага цвета синьки, тёмно-синие чернила, янтарь только для построенного. */
:root{
  --bg:#E9EEF4; --panel:#FFFFFF; --ink:#13233A; --muted:#566884; --line:#C4D0E0; --grid:#D6E0EC;
  --blue:#1D5FC4; --blue-ink:#FFFFFF; --amber:#B36F00; --amber-bg:#FFF1D6;
  --ok:#17794A; --ok-bg:#DDF3E6; --bad:#B3261E; --bad-bg:#FBE4E2; --code-bg:#F3F6FA;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1624; --panel:#152238; --ink:#E7EEF8; --muted:#92A5C0; --line:#2B3D5A; --grid:#1B2B45;
    --blue:#6BA6FF; --blue-ink:#0A1830; --amber:#F2B33D; --amber-bg:#3A2D12;
    --ok:#5FD39A; --ok-bg:#12372A; --bad:#FF8A80; --bad-bg:#3E1D1B; --code-bg:#0F1B2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1624; --panel:#152238; --ink:#E7EEF8; --muted:#92A5C0; --line:#2B3D5A; --grid:#1B2B45;
  --blue:#6BA6FF; --blue-ink:#0A1830; --amber:#F2B33D; --amber-bg:#3A2D12;
  --ok:#5FD39A; --ok-bg:#12372A; --bad:#FF8A80; --bad-bg:#3E1D1B; --code-bg:#0F1B2E; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{font:18px var(--display);letter-spacing:.02em;margin:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 14px;cursor:pointer}
button:focus-visible,.ed:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.main{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:700}
button.small{min-height:36px;padding:4px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
h2{font:18px var(--display);margin:0}
p{margin:0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:5px}
.meta{font:12px var(--mono);color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.say{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.avatar{flex:none;display:block;width:40px;height:40px;border-radius:50%;overflow:hidden}
.avatar svg{display:block;width:100%;height:100%}
.town{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.town svg{display:block;width:100%;height:auto}
.townbar{display:flex;justify-content:space-between;gap:8px;font:12px var(--mono);color:var(--blue);padding:8px 12px;border-bottom:1px solid var(--line)}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
@media (prefers-reduced-motion:reduce){.drop{animation:none}}
.ed::placeholder{color:var(--muted)}
.plot{border:1.5px solid var(--blue);border-radius:6px;padding:10px;background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.plothead{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--blue);margin-bottom:8px}
.empty{border:1.5px dashed var(--blue);border-radius:6px;padding:30px 14px;text-align:center;color:var(--muted);background:var(--panel)}
.building{border-top:6px solid var(--amber);border-radius:2px;background:#fff;overflow:hidden}
.building .pv{border:0;border-radius:0}
.cap{font-size:13px;color:var(--muted);margin-top:8px}
.m{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.m.lock{opacity:.55}
.num{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:12px var(--mono)}
.m .nm{font-weight:700;flex:1;min-width:0}
.m .tp{font:12px var(--mono);color:var(--muted)}
.active{border:1.5px solid var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:12px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.done{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.step{min-height:40px;padding:6px 4px;font-size:13px;text-align:center}
.step.on{border-color:var(--blue);color:var(--blue);font-weight:700}
.step.done{color:var(--ok)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{min-width:44px;padding:6px 10px}
.pills button.on{border-color:var(--blue);color:var(--blue);font-weight:700}
.pills button.ok{color:var(--ok)}
.task{font-size:15px}
.pvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pv{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);min-width:0}
.pv.blue{border:1.5px dashed var(--blue)}
.pv.ok{border-color:var(--ok)}
.pvlabel{font:11px var(--mono);color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.pv.ok .pvlabel{color:var(--ok)}
.pv.blue .pvlabel{color:var(--blue)}
.ed{display:block;width:100%;min-height:132px;resize:vertical;font:16px/1.5 var(--mono);background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;tab-size:2}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-family:var(--mono);min-height:40px;min-width:52px;padding:6px 12px}
.btns{display:flex;gap:8px}
.btns button{flex:1}
.btns button.main{flex:2}
.hint{background:var(--amber-bg);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px}
.hint pre{margin:6px 0 0;font:14px/1.5 var(--mono);white-space:pre-wrap}
.res{border-radius:10px;padding:10px 12px;font-size:14px}
.res.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.res.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.res .btns{margin-top:8px}
.code{font:14px/1.5 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-x:auto;margin:0}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.part{border:1px solid var(--line);border-radius:8px;background:var(--code-bg);padding:6px 10px;text-align:center}
.part b{display:block;font:500 14px var(--mono)}
.part span{font-size:12px;color:var(--muted)}
.badbox{border:1px solid var(--bad);border-radius:8px;padding:8px 10px;background:var(--bad-bg)}
.badbox .code{background:transparent;border:0;padding:0}
.pvhost{display:block}
.saytext{min-width:0}
.saytext p+p{margin-top:6px}
.voice{font-weight:700;margin-bottom:4px}
.res .note{color:var(--muted)}
</style>

<div class="wrap">
  <div class="top">

<script>
const SAVE_KEY = 'hcq_save1';
const MASTER = {
  name: 'Вывесочник', topic: 'h1, p', tags: ['h1', 'p', 'b'],
  say: { build: 'Вот дядин чертёж. Повтори по нему, не спеши, но и не тяни.' },
  win: 'Вот это вывеска. Флекс бы гордился.',
  outro: [
    'Знаешь, за что я ему должен? Когда сгорела мастерская, он всю ночь таскал воду, а утром молча принёс свой стол: «Работай». Стол я так и не вернул.',
    'Теперь иди к Писарю: на вывеске одно слово, а таверне нужно меню.',
    'И заметь, в углу чертежа дядина приписка: «Для главного. Откроешь последним». Странный он был.'
  ],
  lesson: [
    { t: 'Тег: метка для браузера',
      say: ['Ты племянник Флекса? Похож. Дядя оставил мне долг, так что учу. Но халтуры не терплю. Таверна без вывески это просто дом, начнём с неё. Смотри на примере кузницы.',
            'Тег как скобки у вывески: открыл, закрыл. Без пары это халтура.'],
      text: 'Страница состоит из тегов. Это метки в угловых скобках: они говорят браузеру, что перед ним, заголовок или обычный текст. Тег парный: сначала открывающий, потом содержимое, потом закрывающий со слэшем.',
      parts: [['<h1>', 'открывающий'], ['Кузница', 'текст внутри'], ['</h1>', 'закрывающий']],
      code: '<h1>Кузница</h1>', show: true },
    { t: 'h1 и p',
      say: 'Заголовок один. Одна вывеска на дом. Две уже балаган.',
      text: '<code>h1</code> (heading, «заголовок») это главная вывеска страницы, она одна. <code>p</code> (paragraph, «абзац») это обычный текст под ней. Браузер сам делает заголовок крупным и жирным, а абзацы отделяет отступами.',
      code: '<h1>Кузница</h1>\n<p>Подковы и мечи на заказ.</p>', show: true },
    { t: 'Тег внутри тега',
      say: 'Положил один тег в другой, закрывай тот, что открыл последним.',
      text: 'Один тег можно положить внутрь другого. Тег <code>b</code> делает текст жирным. Закрывать нужно в обратном порядке: сначала внутренний, потом внешний, как матрёшку.',
      code: '<p>Подковы <b>острые</b> и крепкие.</p>', show: true,
      bad: '<p>Подковы <b>острые</p></b>',
      badNote: 'Так нельзя: <b> открыт позже, значит и закрыть его нужно раньше.' }
  ],
  train: [
    { say: 'Теперь сам. Три небольших заказа для кузницы. Первый: вывеска.',
      praise: 'Ровно. Для первого раза сойдёт.',
      task: 'Сделай вывеску для кузницы: заголовок <code>Кузница</code>.',
      starter: '', target: '<h1>Кузница</h1>',
      hints: ['У пары тегов есть открывающий и закрывающий. Тапни кнопку h1: она вставит оба.',
              'Курсор встанет между тегами. Напечатай там слово: Кузница.',
              '<h1>Кузница</h1>'],
      solution: '<h1>Кузница</h1>',
      rule: b => needOne(b, 'h1', 'Кузница') },
    { say: 'Вывеска есть. Теперь пара слов под ней.',
      praise: 'Неплохо. Абзац сидит где надо.',
      task: 'Добавь под заголовком абзац: <code>Подковы и мечи</code>.',
      starter: '<h1>Кузница</h1>\n', target: '<h1>Кузница</h1><p>Подковы и мечи</p>',
      hints: ['Абзац это тег p. Он идёт после закрывающего </h1>, а не внутри заголовка.',
              'Курсор должен стоять после </h1>. Тапни там, потом кнопку p.',
              '<h1>Кузница</h1>\n<p>Подковы и мечи</p>'],
      solution: '<h1>Кузница</h1>\n<p>Подковы и мечи</p>',
      rule: b => needOne(b, 'h1', 'Кузница') || needOne(b, 'p', 'Подковы и мечи') || needOrder(b) },
    { say: 'Последний заказ с подвохом: кто-то уже начал, но напортачил.',
      praise: 'Нашёл ошибку? Значит, глаз есть. Флекс одобрил бы.',
      task: 'Вывеска сломалась: сравни «Нужно» и «У тебя». Найди ошибку в коде и исправь.',
      starter: '<h1>Кузница<h1>\n<p>Горн горит</p>', target: '<h1>Кузница</h1><p>Горн горит</p>',
      hints: ['В «У тебя» абзац стал огромным и жирным. Значит, какой-то тег остался открытым.',
              'У пары <h1> второй тег должен быть закрывающим, со слэшем: </h1>.',
              '<h1>Кузница</h1>\n<p>Горн горит</p>'],
      solution: '<h1>Кузница</h1>\n<p>Горн горит</p>',
      rule: b => needOne(b, 'h1', 'Кузница') || needOne(b, 'p', 'Горн горит') || needOrder(b) }
  ],
  build: {
    task: 'Повтори чертёж: вывеска «Таверна у моста», под ней абзац «Тёплый ужин и ночлег для путников.», слово «ночлег» жирным.',
    target: '<h1>Таверна у моста</h1><p>Тёплый ужин и <b>ночлег</b> для путников.</p>',
    hints: ['Заголовок это h1, абзац это p. Слово «ночлег» лежит внутри абзаца.',
            'Выдели слово «ночлег» и тапни b: оно обернётся в тег. Или тапни b и напечатай слово внутри.',
            '<h1>Таверна у моста</h1>\n<p>Тёплый ужин и <b>ночлег</b> для путников.</p>'],
    solution: '<h1>Таверна у моста</h1>\n<p>Тёплый ужин и <b>ночлег</b> для путников.</p>',
    rule: b => {
      let m = needOne(b, 'h1', 'Таверна у моста') || needOne(b, 'p', 'Тёплый ужин и ночлег для путников.');
      if (m) return m;
      const p = b.querySelector('p'), bold = p.querySelector('b');
      if (!bold) return 'Слово «ночлег» должно быть жирным: оберни его в тег <b> внутри абзаца.';
      if (!same(bold.textContent, 'ночлег')) return 'Жирным должно быть только слово «ночлег», а у тебя «' + norm(bold.textContent) + '».';
      return needOrder(b);
    }
  }
};
const ALL_MASTERS = [
  ['Вывесочник', 'h1, p'], ['Писарь', 'h2, ul, li'], ['Художник', 'img'], ['Почтальон', 'a'],
  ['Плотник', 'div, section'], ['Кузнец', 'button, form, input'], ['Красильщик', 'color, background'],
  ['Каменщик', 'padding, margin, border'], ['Столяр', 'flexbox'], ['Резчик по шаблонам', 'class']
];

/* ---------- проверка ---------- */
function norm(s){ return s.replace(/\s+/g, ' ').trim(); }
function same(a, b){ const f = s => norm(s).replace(/ё/g, 'е').replace(/Ё/g, 'Е'); return f(a) === f(b); }
const VOID = new Set(['img', 'br', 'hr', 'input', 'meta', 'link']);
function balance(code){
  const re = /<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/g;
  const st = []; let m;
  while ((m = re.exec(code))){
    const close = m[1] === '/', name = m[2].toLowerCase();
    if (VOID.has(name)) continue;
    if (!close){ st.push(name); continue; }
    if (!st.length) return 'Лишний закрывающий тег </' + name + '>: перед ним нет открывающего.';
    const top = st[st.length - 1];
    if (top !== name) return 'Ожидался </' + top + '>, а найден </' + name + '>. Теги закрывают в обратном порядке: сначала внутренний.';
    st.pop();
  }
  if (st.length){
    const t = st[st.length - 1];
    return 'Тег <' + t + '> не закрыт. Закрывающий тег пишется со слэшем: </' + t + '>.';
  }
  return null;
}
function needOne(body, tag, text){
  const list = [...body.querySelectorAll(tag)];
  if (!list.length) return 'Не нашёл тег <' + tag + '>.';
  if (list.length > 1) return 'У тебя ' + list.length + ' тегов <' + tag + '>, а нужен один.';
  const got = norm(list[0].textContent);
  if (!same(got, text)) return 'В теге <' + tag + '> должно быть «' + text + '», а у тебя «' + got + '».';
  return null;
}
function needOrder(body){
  const h = body.querySelector('h1'), p = body.querySelector('p');
  if (h && p && !(h.compareDocumentPosition(p) & Node.DOCUMENT_POSITION_FOLLOWING)) return 'Абзац должен идти под заголовком.';
  return null;
}
function voiceFor(msg){
  let m;
  if ((m = /^Тег <(\w+)> не закрыт/.exec(msg))) return 'Дверь открыл, а закрыть забыл? Каждому <' + m[1] + '> нужен свой </' + m[1] + '>.';
  if (/^Лишний закрывающий/.test(msg)) return 'Закрываешь то, чего не открывал. Так не бывает.';
  if (/^Ожидался/.test(msg)) return 'Не в том порядке. Что открыл последним, закрой первым.';
  if ((m = /^Не нашёл тег <(\w+)>/.exec(msg))) return m[1] === 'h1' ? 'Где вывеска? Пустое место это не вывеска.' : 'А текст где? Под вывеской должен быть абзац.';
  if ((m = /^У тебя \d+ тегов <(\w+)>/.exec(msg))) return m[1] === 'h1' ? 'Вывеска одна. Две это уже балаган.' : 'Лишнее убери: нужен один.';
  if (/^В теге <\w+> должно быть/.test(msg)) return 'Буквы те, да не те. Сверь с образцом.';
  if (/^Абзац должен идти под/.test(msg)) return 'Вывеска над текстом, а не наоборот.';
  if (/^Слово «ночлег» должно быть жирным/.test(msg)) return 'Где нажим? Заверни «ночлег» в <b>, и слово станет жирным.';
  if (/^Жирным должно быть только/.test(msg)) return 'Жирным только «ночлег». Остальное не трогай.';
  if (/^Редактор пока пуст/.test(msg)) return 'Начни хоть с чего-нибудь. Тапни тег, и пара готова.';
  return '';
}
function judge(code, rule){
  if (!code.trim()) return 'Редактор пока пуст. Тапни кнопку тега, чтобы начать.';
  const bal = balance(code);
  if (bal) return bal;
  const doc = new DOMParser().parseFromString(code, 'text/html');
  return rule(doc.body);
}

/* ---------- сохранение ---------- */
let S = { intro: false, lesson: false, train: [false, false, false], built: null };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s && Array.isArray(s.train)) S = Object.assign(S, s);
} catch (e) {}
if (S.lesson || S.built || S.train.some(Boolean)) S.intro = true;
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- помощники интерфейса ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const BAD_TAGS = 'script,iframe,object,embed,link,meta,base,frame,frameset,applet';
function clean(html){
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll(BAD_TAGS).forEach(n => n.remove());
  d.querySelectorAll('body *').forEach(n => {
    for (const a of [...n.attributes]){
      const nm = a.name.toLowerCase();
      if (nm.startsWith('on') || (/^\s*javascript:/i.test(a.value) && (nm === 'href' || nm === 'src' || nm === 'action'))) n.removeAttribute(a.name);
    }
  });
  const frag = document.createDocumentFragment();
  d.head.querySelectorAll('style').forEach(s => frag.append(document.importNode(s, true)));
  [...d.body.childNodes].forEach(n => frag.append(document.importNode(n, true)));
  return frag;
}
function mkPreview(label, cls){
  const box = el('div', { class: 'pv' + (cls ? ' ' + cls : '') });
  if (label) box.append(el('div', { class: 'pvlabel' }, label));
  const host = el('div', { class: 'pvhost' });
  box.append(host);
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>:host{display:block}.page{box-sizing:border-box;padding:10px 12px;min-height:92px;background:#fff;color:#14181f;font:16px/1.45 "Times New Roman",Times,serif;overflow:auto;overflow-wrap:anywhere}</style><div class="page"></div>';
  const page = root.querySelector('.page');
  page.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) e.preventDefault(); });
  return { box, set(html){ page.replaceChildren(clean(html)); } };
}
function insertTag(ta, name){
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  const open = '<' + name + '>', close = '</' + name + '>';
  ta.setRangeText(open + sel + close, s, e, 'end');
  const pos = s + open.length + sel.length;
  ta.setSelectionRange(pos, pos);
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}
function exitTag(ta){
  const v = ta.value, p = ta.selectionEnd, i = v.indexOf('</', p);
  let pos = v.length;
  if (i >= 0){ const j = v.indexOf('>', i); pos = j < 0 ? v.length : j + 1; }
  ta.setSelectionRange(pos, pos);
  ta.focus();
}

/* ---------- состояние экрана ---------- */
const app = document.getElementById('app');
const ui = { screen: 'city', step: 'lesson', card: 0, task: 0 };
const drafts = {}, hintsUsed = {};
function go(patch){ Object.assign(ui, patch); render(); window.scrollTo(0, 0); }
function render(){ app.replaceChildren(ui.screen === 'city' ? cityView() : ui.screen === 'scene' ? sceneView() : masterView()); }
function trainDone(){ return S.train.filter(Boolean).length; }
function firstUndone(){ const i = S.train.indexOf(false); return i < 0 ? 0 : i; }
const AVATAR_SVG = '<svg viewBox="0 0 48 48" role="img" aria-label="Вывесочник"><rect width="48" height="48" fill="var(--amber-bg)"/><path d="M2 48 Q24 30 46 48Z" fill="var(--blue)"/><circle cx="24" cy="22" r="10" fill="#E9B88C"/><path d="M14 25 Q24 42 34 25 Q34 32 24 35 Q14 32 14 25Z" fill="#9AA3B2"/><path d="M13 19 Q24 5 35 19Z" fill="var(--amber)"/><line x1="17" y1="18.5" x2="22" y2="20.2" stroke="#13233A" stroke-width="1.6" stroke-linecap="round"/><line x1="31" y1="18.5" x2="26" y2="20.2" stroke="#13233A" stroke-width="1.6" stroke-linecap="round"/><circle cx="20" cy="23" r="1.3" fill="#13233A"/><circle cx="28" cy="23" r="1.3" fill="#13233A"/><rect x="33" y="19" width="2.4" height="9" rx="1" fill="var(--amber)" transform="rotate(12 34 23)"/></svg>';
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function signParts(code){
  const d = new DOMParser().parseFromString(code, 'text/html');
  const h = d.querySelector('h1'), p = d.querySelector('p');
  let line = '';
  if (p) p.childNodes.forEach(n => {
    const t = n.textContent.replace(/\s+/g, ' ');
    if (!t) return;
    line += n.nodeName.toLowerCase() === 'b' ? '<tspan font-weight="700">' + esc(t) + '</tspan>' : esc(t);
  });
  return { title: h ? norm(h.textContent) : '', line: line.trim() };
}
function tavernSVG(built, fresh){
  const ghost = 'fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"';
  const lab = (x, y, t) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + t + '</text>';
  let sign;
  if (built){
    const s = signParts(built);
    sign = '<g class="' + (fresh ? 'drop' : '') + '"><line x1="112" y1="152" x2="112" y2="166" stroke="var(--muted)" stroke-width="1.5"/><line x1="268" y1="152" x2="268" y2="166" stroke="var(--muted)" stroke-width="1.5"/>'
      + '<rect x="98" y="166" width="184" height="30" rx="4" fill="var(--panel)" stroke="var(--blue)" stroke-width="1.5"/>'
      + '<text x="190" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">' + esc(s.title) + '</text>'
      + '<text x="190" y="214" text-anchor="middle" font-size="12" fill="var(--ink)">' + s.line + '</text></g>';
  } else {
    sign = '<rect x="98" y="166" width="184" height="30" rx="4" ' + ghost.replace('var(--line)', 'var(--blue)') + '/>' + lab(190, 185, 'Вывесочник: вывеска');
  }
  return '<svg viewBox="0 0 380 470" role="img" aria-label="Участок таверны у каменного моста"><title>Участок таверны у каменного моста</title>'
    + '<circle cx="340" cy="44" r="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.5"/>'
    + '<rect x="0" y="372" width="380" height="60" fill="var(--ok-bg)"/>'
    + '<rect x="0" y="432" width="380" height="38" fill="var(--grid)"/>'
    + '<rect x="96" y="404" width="188" height="34" fill="var(--code-bg)" stroke="var(--line)" stroke-width="1"/>'
    + '<ellipse cx="190" cy="438" rx="34" ry="24" fill="var(--grid)" stroke="var(--line)" stroke-width="1"/>'
    + '<rect x="70" y="152" width="240" height="220" ' + ghost + '/>'
    + '<rect x="246" y="96" width="16" height="44" ' + ghost + '/>'
    + '<polygon points="58,152 190,78 322,152" ' + ghost + ' stroke-linejoin="round"/>'
    + sign
    + '<rect x="88" y="228" width="68" height="60" ' + ghost + '/>' + lab(122, 262, 'Художник')
    + '<rect x="164" y="240" width="52" height="132" rx="4" ' + ghost + '/>' + lab(190, 310, 'Кузнец')
    + '<rect x="228" y="226" width="76" height="84" rx="4" ' + ghost + '/>' + lab(266, 272, 'Писарь')
    + '<rect x="78" y="380" width="44" height="8" rx="2" ' + ghost + '/><rect x="168" y="380" width="44" height="8" rx="2" ' + ghost + '/><rect x="258" y="380" width="44" height="8" rx="2" ' + ghost + '/>'
    + lab(40, 392, 'Столяр')
    + '</svg>';
}
function say(text){
  const lines = [].concat(text);
  return el('div', { class: 'say' }, el('span', { class: 'avatar', html: AVATAR_SVG }),
    el('div', { class: 'saytext' }, lines.map((l, i) => el('p', null, (i === 0 ? MASTER.name + ': ' : '') + '«' + l + '»'))));
}
function sceneView(){
  return el('div', { class: 'stack' }, el('div', { class: 'card stack' },
    el('div', { class: 'meta' }, 'Мастерская Вывесочника, вечер'),
    say(MASTER.outro),
    el('button', { class: 'main', type: 'button', onclick: () => go({ screen: 'city' }) }, 'В город')));
}

/* ---------- город ---------- */
function cityView(){
  if (!S.intro){
    return el('div', { class: 'stack' }, el('div', { class: 'card stack' },
      el('div', { class: 'meta' }, 'Боксбург'),
      el('div', { class: 'town', html: tavernSVG(null, false) }),
      el('h2', null, 'Письмо из Боксбурга'),
      el('p', null, 'Дядя Флекс, старый трактирщик, оставил тебе участок у каменного моста и чертёж таверны.'),
      el('p', null, 'Условие в завещании: открыть таверну можно, только построив её самому, с помощью мастеров города. Каждый из них когда-то остался в долгу перед Флексом.'),
      el('p', null, 'В углу чертежа приписка: «Для главного. Откроешь последним».'),
      el('button', { class: 'main', type: 'button', onclick: () => { S.intro = true; save(); render(); } }, 'Отправиться на участок')));
  }
  const root = el('div', { class: 'stack' });
  const fresh = ui.fresh; ui.fresh = false;
  root.append(
    el('section', { class: 'town' },
      el('div', { class: 'townbar' }, el('span', null, 'Боксбург · участок у моста'), el('span', null, 'Деталей: ' + (S.built ? 1 : 0) + ' из 10')),
      el('div', { class: 'tavern', 'data-built': S.built ? '1' : '0', html: tavernSVG(S.built, fresh) })),
    el('p', { class: 'note' }, S.built ? 'Вывеска повешена. Остальное пока только на чертеже.' : 'Пунктир это дядин чертёж. Каждый мастер строит свою часть.'));

  const td = trainDone();
  const act = el('div', { class: 'card active stack' });
  act.append(el('div', { class: 'm', style: 'border:0;padding:0;background:transparent' },
    el('span', { class: 'avatar', html: AVATAR_SVG }), el('div', { class: 'nm' }, MASTER.name), el('div', { class: 'tp' }, MASTER.topic)));
  act.append(el('div', { class: 'chips' },
    el('span', { class: 'chip' + (S.lesson ? ' done' : '') }, 'Урок'),
    el('span', { class: 'chip' + (td === 3 ? ' done' : '') }, 'Тренировка ' + td + '/3'),
    el('span', { class: 'chip' + (S.built ? ' done' : '') }, 'Стройка')));
  const label = S.built ? 'Открыть мастерскую' : (S.lesson || td ? 'Продолжить' : 'Войти в мастерскую');
  act.append(el('button', { class: 'main', type: 'button', onclick: () => {
    const step = !S.lesson && !td ? 'lesson' : (td === 3 ? 'build' : 'train');
    go({ screen: 'master', step, card: 0, task: firstUndone() });
  } }, label));
  root.append(act);

  const list = el('div', { class: 'stack', style: 'gap:6px' });
  ALL_MASTERS.slice(1).forEach((m, i) => {
    list.append(el('div', { class: 'm lock' }, el('div', { class: 'num' }, String(i + 2)), el('div', { class: 'nm' }, m[0]), el('div', { class: 'tp' }, m[1])));
  });
  root.append(list, el('p', { class: 'note' }, 'Остальные мастера откроются в следующих главах.'));
  return root;
}

/* ---------- мастерская ---------- */
function masterView(){
  const root = el('div', { class: 'stack' });
  root.append(el('div', { class: 'top', style: 'margin:0' },
    el('button', { class: 'small', type: 'button', onclick: () => go({ screen: 'city' }) }, '← В город'),
    el('h2', null, MASTER.name)));
  const td = trainDone();
  const items = [['lesson', 'Урок', S.lesson], ['train', 'Тренировка ' + td + '/3', td === 3], ['build', 'Стройка', !!S.built]];
  root.append(el('div', { class: 'steps' }, items.map(([id, label, done]) =>
    el('button', { type: 'button', class: 'step' + (ui.step === id ? ' on' : '') + (done ? ' done' : ''), onclick: () => go({ step: id }) }, (done ? '✓ ' : '') + label))));
  root.append(ui.step === 'lesson' ? lessonView() : ui.step === 'train' ? trainView() : buildView());
  return root;
}

function lessonView(){
  const L = MASTER.lesson, c = L[ui.card];
  const wrap = el('div', { class: 'stack' });
  wrap.append(say(c.say));
  const card = el('div', { class: 'card stack' });
  card.append(el('div', { class: 'meta' }, 'Карточка ' + (ui.card + 1) + ' из ' + L.length), el('h2', null, c.t), el('p', { html: c.text }));
  if (c.parts) card.append(el('div', { class: 'parts' }, c.parts.map(p => el('div', { class: 'part' }, el('b', null, p[0]), el('span', null, p[1])))));
  else card.append(el('pre', { class: 'code' }, c.code));
  if (c.show){ const pv = mkPreview('Получится'); pv.set(c.code); card.append(pv.box); }
  if (c.bad) card.append(el('div', { class: 'badbox' }, el('pre', { class: 'code' }, c.bad), el('p', { class: 'note' }, c.badNote)));
  wrap.append(card);
  const last = ui.card === L.length - 1;
  const nav = el('div', { class: 'btns' });
  if (ui.card > 0) nav.append(el('button', { type: 'button', onclick: () => go({ card: ui.card - 1 }) }, 'Назад'));
  nav.append(el('button', { class: 'main', type: 'button', onclick: () => {
    if (!last) return go({ card: ui.card + 1 });
    S.lesson = true; save(); go({ step: 'train', task: firstUndone() });
  } }, last ? 'К тренировке' : 'Дальше'));
  wrap.append(nav);
  return wrap;
}

function trainView(){
  const wrap = el('div', { class: 'stack' });
  wrap.append(say(MASTER.train[ui.task].say));
  wrap.append(el('div', { class: 'pills' }, MASTER.train.map((t, i) =>
    el('button', { type: 'button', class: (i === ui.task ? 'on ' : '') + (S.train[i] ? 'ok' : ''), onclick: () => go({ task: i }) }, (S.train[i] ? '✓ ' : '') + (i + 1)))));
  const i = ui.task, t = MASTER.train[i];
  wrap.append(workbench({
    key: 'train' + i, task: t.task, starter: t.starter, target: t.target, rule: t.rule, hints: t.hints, solution: t.solution,
    labels: ['Нужно', 'У тебя'],
    onPass: (code, res) => {
      S.train[i] = true; save();
      const box = el('div', { class: 'res ok' }, el('div', null, i < 2 ? 'Верно.' : 'Верно. Тренировка пройдена.'),
        el('div', { class: 'voice' }, MASTER.name + ': «' + t.praise + '»'));
      box.append(el('div', { class: 'btns' }, el('button', { class: 'main', type: 'button', onclick: () => go(i < 2 ? { task: i + 1 } : { step: 'build' }) }, i < 2 ? 'Следующее задание' : 'К стройке')));
      res.replaceChildren(box);
    }
  }));
  return wrap;
}

function buildView(){
  const wrap = el('div', { class: 'stack' });
  if (trainDone() < 3){
    wrap.append(el('div', { class: 'card stack' }, el('p', null, 'Стройка откроется, когда решишь три тренировочных задания. Сейчас: ' + trainDone() + '/3.'),
      el('button', { class: 'main', type: 'button', onclick: () => go({ step: 'train', task: firstUndone() }) }, 'К тренировке')));
    return wrap;
  }
  wrap.append(say(MASTER.say.build));
  const b = MASTER.build;
  wrap.append(workbench({
    key: 'build', task: b.task, starter: S.built || '', target: b.target, rule: b.rule, hints: b.hints, solution: b.solution,
    labels: ['Чертёж', 'Твоя таверна'], blueprint: true,
    onPass: (code, res) => {
      S.built = code; ui.fresh = true; save();
      const box = el('div', { class: 'res ok' }, el('div', null, 'Деталь построена: вывеска встала на место.'),
        el('div', { class: 'voice' }, MASTER.name + ': «' + MASTER.win + '»'));
      box.append(el('div', { class: 'btns' },
        el('button', { type: 'button', onclick: () => go({ screen: 'city' }) }, 'В город'),
        el('button', { class: 'main', type: 'button', onclick: () => go({ screen: 'scene' }) }, 'Слушать дальше')));
      res.replaceChildren(box);
    }
  }));
  return wrap;
}

/* ---------- рабочий стол: задание, образец, редактор ---------- */
function workbench(cfg){
  const k = cfg.key;
  hintsUsed[k] = hintsUsed[k] || 0;
  const wrap = el('div', { class: 'stack' });
  const res = el('div');
  wrap.append(el('p', { class: 'task', html: cfg.task }));
  const need = mkPreview(cfg.labels[0], cfg.blueprint ? 'blue' : ''); need.set(cfg.target);
  const mine = mkPreview(cfg.labels[1]);
  wrap.append(el('div', { class: 'pvgrid' }, need.box, mine.box));

  const ta = el('textarea', { class: 'ed', id: 'code-editor', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', 'aria-label': 'Код', placeholder: 'Тапни тег под полем, например <h1>' });
  ta.value = drafts[k] != null ? drafts[k] : cfg.starter;
  mine.set(ta.value);
  ta.addEventListener('input', () => { drafts[k] = ta.value; mine.set(ta.value); res.replaceChildren(); mine.box.classList.remove('ok'); });
  wrap.append(ta);

  const tags = el('div', { class: 'tags' });
  MASTER.tags.forEach(name => tags.append(el('button', { class: 'tg', type: 'button', 'aria-label': 'Вставить тег ' + name, onclick: () => insertTag(ta, name) }, '<' + name + '>')));
  tags.append(el('button', { class: 'tg', type: 'button', onclick: () => exitTag(ta) }, '↵ выйти'));
  tags.addEventListener('mousedown', e => e.preventDefault());
  wrap.append(tags);

  const hintBox = el('div', { class: 'stack', style: 'gap:6px' });
  const hintB = el('button', { type: 'button' });
  function showHints(){
    hintBox.replaceChildren();
    for (let n = 0; n < hintsUsed[k]; n++){
      hintBox.append(n === 2
        ? el('div', { class: 'hint' }, el('b', null, 'Решение:'), el('pre', null, cfg.hints[2]))
        : el('div', { class: 'hint' }, cfg.hints[n]));
    }
    hintB.textContent = 'Подсказка ' + hintsUsed[k] + '/3';
    hintB.disabled = hintsUsed[k] >= 3;
  }
  showHints();
  hintB.addEventListener('click', () => { if (hintsUsed[k] < 3){ hintsUsed[k]++; showHints(); } });

  const check = el('button', { class: 'main', type: 'button', onclick: () => {
    const msg = judge(ta.value, cfg.rule);
    res.replaceChildren();
    if (msg){
      mine.box.classList.remove('ok');
      const v = voiceFor(msg);
      res.append(el('div', { class: 'res bad' }, v ? el('div', { class: 'voice' }, MASTER.name + ': «' + v + '»') : null, el('div', { class: 'note' }, msg)));
      return;
    }
    mine.box.classList.add('ok');
    cfg.onPass(ta.value, res);
  } }, 'Проверить');
  const reset = el('button', { type: 'button', onclick: () => { ta.value = cfg.starter; ta.dispatchEvent(new Event('input')); } }, 'Заново');
  wrap.append(el('div', { class: 'btns' }, check, hintB, reset), hintBox, res);
  return wrap;
}

/* ---------- сброс ---------- */
const resetBtn = document.getElementById('resetBtn');
let armTimer = null;
resetBtn.addEventListener('click', () => {
  if (resetBtn.dataset.arm){
    clearTimeout(armTimer);
    S = { intro: false, lesson: false, train: [false, false, false], built: null };
    [drafts, hintsUsed].forEach(o => Object.keys(o).forEach(x => delete o[x]));
    save(); resetBtn.dataset.arm = ''; resetBtn.textContent = 'Начать заново';
    go({ screen: 'city', step: 'lesson', card: 0, task: 0 });
  } else {
    resetBtn.dataset.arm = '1'; resetBtn.textContent = 'Точно сбросить?';
    armTimer = setTimeout(() => { resetBtn.dataset.arm = ''; resetBtn.textContent = 'Начать заново'; }, 3000);
  }
});

render();
</script>
